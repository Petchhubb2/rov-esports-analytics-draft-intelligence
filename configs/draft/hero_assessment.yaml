# การประเมินคุณลักษณะฮีโร่ — ค่าเชิงคุณภาพที่ดึงอัตโนมัติไม่ได้
#
# ══════════════════════════════════════════════════════════════════════
# ใครกรอกไฟล์นี้ และเชื่อได้แค่ไหน
# ══════════════════════════════════════════════════════════════════════
#
# ค่าในไฟล์นี้ประเมินโดย **ผู้ช่วย AI (Claude Opus 5)** ไม่ใช่โค้ชหรือผู้เล่น
# จึงถูกกำกับด้วย filled_kind: assistant และ Composition Engine จะขึ้น
# คำเตือนทุกครั้งที่ใช้ค่าเหล่านี้คิดคะแนน
#
# ทำแบบนี้เพราะ heroes.yaml ว่างทั้ง 119 ตัวมาตลอด ทำให้ Composition Engine
# ที่เขียนเสร็จแล้วใช้งานไม่ได้เลยแม้แต่ครั้งเดียว การมีค่าที่ประเมินไว้
# พร้อมป้ายบอกที่มาชัดเจน ใช้งานได้จริงกว่าการไม่มีอะไรเลย
# **แต่ยังแทนการประเมินของคนที่รู้เกมไม่ได้** เมื่อมีคนมาตรวจแล้ว
# ให้แก้ตัวเลขและเปลี่ยน filled_kind เป็น human
#
# ══════════════════════════════════════════════════════════════════════
# เกณฑ์ที่ใช้ประเมิน — เขียนไว้เพื่อให้คนตรวจย้อนได้ว่าคิดยังไง
# ══════════════════════════════════════════════════════════════════════
#
# ทุกค่า 0-100 เป็นค่า **เชิงสัมพัทธ์เทียบกับฮีโร่ RoV ทั้งหมด** ไม่ใช่เทียบในคลาส
# มาร์คแมนที่ frontline 10 ไม่ได้แปลว่าแย่ แปลว่ามันไม่ใช่หน้าที่มัน
#
#   0-20    แทบไม่มี
#   21-40   มีบ้างแต่ไม่ใช่จุดเด่น
#   41-60   ระดับกลางของเกม
#   61-80   เป็นจุดเด่นที่ทีมพึ่งได้
#   81-100  ดีที่สุดในเกมสายนี้
#
# หลักฐานที่ใช้ประกอบทุกตัว
#   1. ป้ายผลสกิลจาก Liquipedia (data/hero_traits.json) — Stun/Heal/Dash ฯลฯ
#      เป็นข้อเท็จจริง ไม่ใช่ความเห็น ดู rov/draft/importer/herotraits.py
#   2. เลนจริงจากแมตช์ 861 เกมของเราเอง (rov/draft/lanes.py)
#   3. tempo signal จากความยาวเกมที่ชนะเทียบที่แพ้ (stats.game_length_tendency)
#      ค่าบวก = ชนะเกมยาว → เอนไป late · ค่าลบ = ชนะเกมสั้น → เอนไป early
#
# ช่อง scaling ยึด tempo เป็นหลักแล้วปรับด้วยลักษณะฮีโร่
# ช่อง cc_hard/cc_soft/sustain/mobility ยึดป้ายสกิลเป็นหลัก
# ช่องที่เหลือ (engage, peel, poke, frontline, objective, waveclear, splitpush)
# เป็นการประเมินล้วน — ตรวจช่องพวกนี้ก่อนเมื่อมีคนมารีวิว
#
# ══════════════════════════════════════════════════════════════════════
#
# ครอบคลุม 30 ตัวแรกตาม presence จริง = ~72% ของ pick/ban ทั้งหมดในข้อมูล
# ตัวที่เหลือปล่อยว่างไว้ตามหลักเดิม — ระบบจะปฏิเสธการให้คะแนนเอง

