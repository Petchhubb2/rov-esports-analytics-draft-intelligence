# จุดเปลี่ยนของเกมที่ตัวเกมกำหนดเอง — ไม่ใช่ความเห็นใคร

rules:
  - rule_id: PHASE_4MIN_TRIPLE_SHIFT
    name: นาทีที่ 4 เปลี่ยนสามอย่างพร้อมกัน
    phase: EARLY
    priority: 85
    patch: "1.63"
    confidence: HIGH
    conditions:
      - cue: นาฬิกาใกล้ 4:00
        fact: game_clock
        op: gte
        value: 210
    action:
      summary: >-
        ที่ 4:00 เกมเปลี่ยนสามอย่างพร้อมกัน — ป้องกันป่าหายไป
        โล่ป้องกันป้อมหาย และเริ่มส่งรถถัง แปลว่าก่อน 4:00 คือช่วงฟาร์ม
        หลัง 4:00 คือช่วงที่บุกป่าฝั่งศัตรูและกดป้อมได้จริง
        ทีมที่ยังเล่นแบบเดิมหลังนาทีที่ 4 คือทีมที่ช้ากว่าหนึ่งจังหวะ
      assignments:
        - role: jungle
          goto: ป่าฝั่งศัตรู
          note: บุกได้แล้วเมื่อรู้ตำแหน่งป่าคู่แข่ง
        - role: support
          goto: แม่น้ำ
          note: วางตาให้เห็นทางเข้าป่าก่อนบุก
    source:
      type: game_client
      ref: หน้าข้อมูลสมรภูมิในเกม RoV แท็บช่วงเวลา
      detail: >-
        แท็บช่วงเวลาระบุที่ 4:00 ว่า ป้องกันป่าหายไป · โล่ป้องกันป้อมหาย · ส่งรถถัง
        และแบ่งช่วงเกมเป็น 0:00-2:00-4:00-8:00-15:00

  - rule_id: TOWER_NO_CREEP_PENALTY
    name: อย่าตีป้อมตอนไม่มีครีป
    phase: MID
    priority: 60
    patch: "1.63"
    confidence: HIGH
    conditions:
      - cue: จะเข้าตีป้อมแต่ครีปฝ่ายเราตายหมดแล้ว
        fact: friendly_creeps_near_tower
        op: eq
        value: 0
    action:
      summary: >-
        ไม่มีครีปฝ่ายตัวเองอยู่ใกล้ ทุกครั้งที่ตีป้อม ความเสียหายที่ตัวเราได้รับ
        จะเพิ่มขึ้น 60% สะสมสูงสุด 300% นี่คือเหตุผลที่การรอเวฟสำคัญกว่าการรีบตี
        และเป็นเหตุผลที่ทีมที่ชนะปะทะแล้วรีบวิ่งไปตีป้อมทันทีมักเสียคนฟรี
    source:
      type: game_client
      ref: หน้าข้อมูลสมรภูมิในเกม RoV หัวข้อป้อมชั้นใน
      detail: >-
        การปกป้องผ่านครีป — ไม่มีครีปฝ่ายตัวเองอยู่ใกล้ ทุกครั้งที่ตี
        ความเสียหายที่ได้รับเพิ่มขึ้น 60% สูงสุด 300%
        การป้องกันหลอดป้อม — ศัตรูอยู่ในระยะโจมตี ความเสียหายลดลง 70%
