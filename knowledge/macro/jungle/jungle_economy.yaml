# เศรษฐกิจและจังหวะของตำแหน่งป่า
# ต้นทาง knowledge/raw/bac_vs_bru และ knowledge/raw/pro101

rules:
  - rule_id: JUNGLE_CYCLE_IS_SLOWER_THAN_LANE
    name: รอบฟาร์มของป่าช้ากว่ารอบเวฟ นี่คือเหตุผลที่ป่าแบกยาก
    phase: EARLY
    priority: 80
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        แคมป์ป่าเกิดใหม่ราว 75-80 วินาที ในเวลาเท่านั้นเวฟเลนชนกันไปแล้วสองรอบ
        แปลว่ากว่าป่าจะวนรอบฟาร์มได้ครั้งหนึ่ง คนเลนได้ทรัพยากรไปสองรอบแล้ว
        และเวลาป่าเข้าไปแทกเวฟ มันแทกได้แค่รอบเดียว
        นี่คือเหตุผลเชิงโครงสร้างที่ตำแหน่งป่าเล่นให้แบกยากที่สุด
        เวลาวางแผน อย่าคาดหวังให้ป่าแบกดาเมจหรือแบกสกอร์ ให้วางแผนรอบมันแทน
      assignments:
        - role: jungle
          goto: ป่าฝั่งตัวเอง
          note: วนรอบให้ครบ อย่าให้ timing หลุด
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram (knowledge/raw/bac_vs_bru)
      detail: >-
        "ครีปป่าเวลาเกิดมันนาทีนึง หรือไม่ก็ 80 วินาที หรือไม่ก็ 75 วินาที
        ซึ่ง ณ เวลานั้นเวฟมันชนไปแล้ว 2 เวฟ เพราะงั้นกว่าป่ามันจะได้วน timing รอบนึง
        เวฟคุณชนไปแล้ว 2 รอบ แต่เวลามันแทกเวฟคุณ มันแทกได้รอบเดียว
        เพราะงั้นมันถึงเป็นตำแหน่งในแข่งที่เล่นยากชิบหาย"
    data_check:
      verdict: insufficient
      detail: >-
        ยังตรวจเวลาเกิดของแคมป์ป่าไม่ได้ เพราะคลิปแนะนำแผนที่ในเกมไม่ได้ระบุไว้
        และข้อมูล Liquipedia ไม่มีเหตุการณ์ระดับนี้ ต้องรอคลิปแข่งที่จับเวลาได้

  - rule_id: JUNGLE_THREE_CAMPS_PER_SIDE
    name: ฟาร์มฝั่งละสามหลุมพอ ห้าหลุมทำ timing พัง
    phase: EARLY
    priority: 76
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: กำลังวางเส้นทางฟาร์มรอบแรก
        fact: game_clock
        op: lte
        value: 180
    action:
      summary: >-
        เส้นทางที่แนะนำคือฟาร์มฝั่งละสามหลุม รวมสองฝั่งได้หกหลุม บวกเวฟเลนอีกสองเวฟ
        อย่าไล่เก็บให้ครบห้าหลุมต่อฝั่ง เพราะเงินที่ได้เพิ่มไม่คุ้มกับ timing ที่เสียไป
        พอ timing พังจะไปไม่ทันจังหวะที่ทีมต้องการ
        เคลียร์ตัวใหญ่ให้ไวแล้วเก็บตัวเล็กทีหลังก็ได้ ถ้าเวฟกลางกำลังจะชน
      assignments:
        - role: jungle
          goto: ป่าสองฝั่ง
          note: ฝั่งละสามหลุม แล้ววิ่งข้าม
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "มันฟาร์มฝั่งละ 3 หลุม ผมแนะนำสุดแล้ว คุณไม่ต้องไปฟาร์ม 5 หลุมนะ
        5 หลุมมันเงินมันขาดแล้ว timing มันจะพัง
        ... ป่ามันจะได้ฟาร์ม 2 เวฟ บวก 6 หลุม ฝั่งละ 3 หลุม แล้วป่ามันก็จะรวย"

  - rule_id: JUNGLE_DEATH_COSTS_500
    name: ป่าตายหนึ่งครั้ง เงินห่างราวห้าร้อย
    phase: EARLY
    priority: 72
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        ป่าตายหนึ่งครั้งไม่ได้เสียแค่คิล มันเสียรอบฟาร์มทั้งรอบ
        คิดเป็นเวฟกลางหนึ่งเวฟบวกแคมป์ป่าอีกสามถึงสี่หลุม ห่างกันราวห้าร้อย
        ต้นเกมห้าร้อยคือเยอะมาก และมันทบกับ timing ที่หลุดไปด้วย
        เวลาจะเสี่ยงบุกป่าเขา ให้คิดเป็นเงินก่อนว่าคุ้มไหม
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "อันนี้คือข้อเสียเวลาป่าตายนะ ตังค์ห่าง 500 เลย 500 นี่เยอะมากนะ
        ผมบอกให้ 500 ต้นเกมนี่แบบเยอะ มินเนี่ยนเลนกลางทั้งเวฟนึง
        แล้วก็หลุมป่าประมาณ 3-4 หลุม"
    notes: |
      สอดคล้องกับคณิตศาสตร์การตายของแครี่ในคลิป Buriram carry (ราว 284 บาท)
      ของป่าแพงกว่าเพราะเสียทั้งเวฟและแคมป์ ไม่ใช่แค่เวฟอย่างเดียว
      ตัวเลขมาจากความจำของผู้พูด ให้ใช้เป็นลำดับขนาด

  - rule_id: JUNGLE_COUNTER_WITHOUT_SHOWING_MID
    name: จะดักป่าเขา อย่าโผล่กลาง
    phase: EARLY
    priority: 70
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: รู้ว่าป่าฝั่งตรงข้ามกำลังจะวนมาเข้าบัฟ
        fact: enemy_jungle_route_known
        op: eq
        value: true
    action:
      summary: >-
        วิธีเคาน์เตอร์ป่าฝั่งตรงข้ามที่ง่ายที่สุดคือไม่โผล่หน้ากลางเลย
        ให้มุดผ่านเลนข้างเข้าไปรอที่บัฟของเขาแทน
        พอไม่โผล่กลาง เขาจะไม่รู้ว่าเราอยู่ไหน แล้วเดินเข้าบัฟตามปกติ
      assignments:
        - role: jungle
          goto: ป่าฝั่งศัตรู
          note: มุดผ่านเลนข้าง ไม่ผ่านกลาง
        - role: support
          goto: แม่น้ำ
          note: ต้องมีตาก่อน ไม่งั้นเดินเข้าไปตายเปล่า
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "ถ้าคุณอยากเคาน์เตอร์ [ป่าฝั่งตรงข้าม] เล่นโคตรง่ายเลย
        คุณเอาป่าคุณไม่ต้องโผล่กลาง คุณเอาป่าคุณมุดเลนซ้าย
        แล้วคุณไปรอเข้าบัฟเขาง่าย ๆ"
