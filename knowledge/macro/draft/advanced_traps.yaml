# ชั้นเชิงหน้าดราฟต์ระดับลีก และข้อสังเกตเรื่องเมต้า
# ต้นทาง knowledge/raw/bac_vs_bru และ knowledge/raw/pro101

rules:
  - rule_id: DRAFT_PICK_A_DOUBLE_ANSWER_THEN_BAN_ITS_COUNTERS
    name: หยิบตัวที่แก้ได้สองตัว แล้วแบนตัวแก้มันทิ้งในเฟสสอง
    priority: 88
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        กับดักหน้าดราฟต์ที่ได้ผลมาก — หยิบตัวที่ตอบโจทย์ศัตรูได้พร้อมกันสองตัว
        แล้วใช้แบนเฟสสองตัดตัวที่แก้มันทิ้งให้หมด
        อีกฝั่งจะเหลือแต่ตัวที่ไม่มีคำตอบ
        ตัวอย่างในคลิปคือหยิบ Taara ที่แก้ได้ทั้ง Marja และ Sinestrea
        แล้วแบนตัวแก้ Taara จบในเฟสสอง สุดท้ายเขาไม่มีอะไรมาแก้ตรงนั้นเลย
        กว่าแครี่จะมีของพอฆ่าได้ ตัวนั้นก็ตบทีมพังไปแล้ว
      assignments: []
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram (knowledge/raw/bac_vs_bru)
      detail: >-
        "คุณหยิบทาร่ามาใช่ป่ะ มันแก้ 2 ตัวนี้ แก้มาจ้ากับซิน
        แล้วคุณแบนตัวแก้ทาร่าจบในเฟส 2 ทีนี้กลายเป็นว่าคุณไม่มีตัวอะไรมาแก้ตรงนี้เลย
        คุณกดฮายาเตะมา กว่าฮายามันจะมีของฆ่าทาร่า ทาร่ามันตบเพื่อนคุณตายหมดแล้ว"
    notes: |
      ต้องรู้ว่าตัวนั้นแก้อะไรได้บ้างจริง ๆ ก่อน ดูได้ที่แท็บ "ตัวแก้ / แพ้ทาง"
      และผู้พูดย้ำว่า "ทาร่าในแข่งไม่ใช่ทาร่าในแรงค์" — ตัวเดียวกันแต่คนละของ
      ถ้าคนเล่นเซตเวฟไม่เป็น บีบแมพไม่เป็น กับดักนี้ก็ไม่ทำงาน

  - rule_id: META_STRONG_SIDE_LANES_ARE_HARD_TO_BREAK
    name: ทีมที่เลนข้างแข็งพร้อมกันสองเลน เจาะยากที่สุดในเมต้านี้
    phase: OPENING
    priority: 74
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        โครงทีมมาตรฐานในลีกคือเอาเมจไปประคองแครี่ แล้วเอาป่าไปประคองอีกฝั่ง
        แปลว่าปกติจะมีเลนข้างที่อ่อนอยู่หนึ่งเลนให้เจาะเสมอ
        ทีมที่เลนข้างยืนได้เองทั้งสองเลนจึงไม่มีจุดให้เจาะ
        ต้องรอให้เขาพลาดเองกลางเกม หรือไปเอาคืนที่ objective แทน
        เวลาดราฟต์เจอทีมแบบนี้ อย่าฝืนหาจุดเจาะที่เลน ให้วางแผนรอบ objective ตั้งแต่ต้น
      assignments:
        - role: ds
          goto: DS_LANE
          note: ถ้าเราเป็นฝ่ายที่อยากแข็งสองเลน ตัวนี้ต้องยืนได้เอง
        - role: dragon
          goto: DRAGON_LANE
          note: เหมือนกัน ห้ามต้องพึ่งเมจมาประคอง
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ฟอร์มทีม (knowledge/raw/pro101)
      detail: >-
        "ถ้าเลนข้างมันแข็งพร้อมกัน 2 เลน แม่งเจาะโคตรยาก ต้องรอเขาไปทำพลาดเองกลางเกม
        ... ในลีกเรามันไม่ค่อยเห็นทีมที่เลนข้างมันแข็งจ๋า
        ส่วนใหญ่คือเอาเมจไปประคองแครี่ แล้วเอาป่าไปประคองมังกร
        ... เมต้านี้โคตรได้เปรียบ ยิ่งเลนแข็งตายยาก ๆ Impact แม่งเยอะมาก"
    notes: |
      ข้อนี้ยังตรวจกับข้อมูลของเราไม่ได้ เพราะต้องนิยามคำว่า "เลนแข็ง" เป็นตัวเลขก่อน
      ซึ่งต้องมีค่า attribute ของฮีโร่ที่ยังไม่ได้กรอกใน configs/draft/heroes.yaml

  - rule_id: HERO_PLAYED_DESPITE_WEAK_LANE
    name: ตัวที่เลนไม่ดีแต่ลีกยังเล่น เพราะมันจ่ายคืนตอนไฟท์
    phase: OPENING
    priority: 62
    patch: "1.63"
    confidence: MEDIUM
    heroes: [hayate]
    action:
      summary: >-
        Hayate เป็นตัวที่หน้าเลนอ่อน สกิลหนึ่งเคลียร์เวฟไม่ดีตั้งแต่ปรับของ
        แต่ลีกยังเล่นเพราะมันมีประโยชน์ในไฟท์
        แปลว่าถ้าดราฟต์มา ต้องยอมรับว่าเลนเฟสสี่นาทีแรกจะไม่ได้อะไร
        และต้องมีคนอื่นถือแมพให้ อย่าคาดหวังให้มันกดหน้าเลน
      assignments:
        - role: support
          goto: DRAGON_LANE
          note: ต้องประกบ เพราะแครี่กดเลนเองไม่ได้
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "ฮายาตอนนี้เลนแม่งกากมาก แต่ในแข่งมันเล่นกันเพราะว่ามันมีประโยชน์ในไฟท์
        แต่ตัวมันน่ะเลนกากมาตั้งแต่ไหนแต่ไรแล้ว ... แต่ก่อนได้รองเท้าตีไวกับดาวกระจาย
        ปาทีเดียวเวฟเกือบตายหมด ตอนนี้สกิล 1 เวฟไม่หมด"
    data_check:
      verdict: agrees
      n: 258
      detail: >-
        ข้อมูลหนุนชัด — Hayate ถูกเลือกมากที่สุดในบรรดา ADL (pick 258 ban 148
        presence 47%) แต่ win rate ถ่วงแล้วอยู่ที่ 47.9% ซึ่งต่ำกว่าครึ่ง
        เป็นภาพของตัวที่ "ลีกยังหยิบทั้งที่ผลไม่ดี" ตรงกับที่โค้ชอธิบาย
        เทียบกับ Wisp ที่ถูกเลือกน้อยกว่า (202) แต่ wr 53.4%

  - rule_id: CAPHENY_IS_AN_EARLY_TEMPO_CARRY
    name: Capheny ไม่ใช่ตัวรอเรท ถ้าต้นเกมทำไม่ได้ถึงค่อยรอ
    phase: OPENING
    priority: 66
    patch: "1.63"
    confidence: MEDIUM
    heroes: [capheny]
    action:
      summary: >-
        หลายคนเข้าใจว่า Capheny ต้องรอของแล้วค่อยเล่นท้ายเกม
        โค้ชบอกว่าไม่ใช่ — มันเล่นต้นเกมได้และสโนว์บอลดี
        การไปรอเรทคือแผนสำรองเมื่อต้นเกมทำอะไรไม่ได้แล้ว ไม่ใช่แผนหลัก
        ดราฟต์มาแล้วต้องหาทางให้มันได้ทรัพยากรตั้งแต่ต้น
      assignments:
        - role: dragon
          goto: DRAGON_LANE
          note: ต้องได้กดหน้าเลนตั้งแต่ต้น ไม่ใช่ฟาร์มรอ
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ฟอร์มทีม (knowledge/raw/pro101)
      detail: >-
        "คาเฟจริง ๆ มันไม่ต้องเล่นเรทตลอด มันเล่นต้นเกมก็ได้
        ตัวมันสโนว์บอลดีที่สุดในเกม แต่ถ้าต้นคุณทำไม่ได้ คุณก็ต้องไปรอเล่นเรท
        ถ้าต้นเกมมันทำได้นะ ตัวมันไหลเลย"
    data_check:
      verdict: mixed
      n: 237
      detail: >-
        ทิศทางถูก — Capheny มีสัญญาณช่วงเกม -0.136 (n=237) คือเอียงไปทางต้นเกมชัด
        เป็นอันดับสองในบรรดา ADL รองจาก Fennik (-0.168) ไม่ใช่ตัวสายท้ายเกมแน่นอน
        เทียบกับ Elsu (+0.317) ที่เป็นสายท้ายเกมจริง
        แต่คำว่า "สโนว์บอลดีที่สุดในเกม" ยืนยันไม่ได้ Fennik เอียงต้นเกมกว่าอีก
        และ win rate ถ่วงแล้วของ Capheny อยู่ที่ 47.2% ซึ่งไม่ได้โดดเด่น
