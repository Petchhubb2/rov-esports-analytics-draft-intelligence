# หลักการหน้าดราฟต์ — ถอดจากคลิป "หลักการดราฟ" (ดราฟ 101)
# ต้นทาง knowledge/raw/darf
#
# phase ว่างไว้ = ใช้ตอนหน้าดราฟต์ ก่อนเกมเริ่ม ยังไม่มีนาฬิกา

rules:
  - rule_id: DRAFT_FIRST_PICK_AIM_BALANCED
    name: First Pick ไม่ได้มีของโกง เป้าหมายคือดราฟต์ให้ทรง 50-50
    priority: 85
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        เมต้าตอนนี้ฝั่ง First Pick ไม่ได้มี priority มากพอจะดราฟต์ให้ชนะขาด
        การดราฟต์ออกมาทรง ๆ 50-50 คือผลลัพธ์ที่ดีที่สุดแล้ว
        ให้เตรียมคอมไว้สัก 1-2 ชุดก่อนเข้าห้อง แล้วเซ็ตไว้เลยว่าเกมแรกจะเล่นอะไร
        อย่าเข้าไปคิดสด
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101) — knowledge/raw/darf
      detail: >-
        "ฝั่ง First Pick ไม่ได้มีเยอะขนาดนั้นที่จะดราฟต์ให้ตัวเองชนะขาดได้
        ก็ดราฟต์ให้ทรง ๆ 50-50 เป็นเรื่องที่ดีที่สุด
        ส่วน First Pick เราก็หาไว้สักคอมสองคอม แล้วก็เซ็ตไว้ว่าเราจะเล่นอะไรเกมแรก"
    data_check:
      verdict: agrees
      n: 861
      detail: >-
        ฝั่งน้ำเงินชนะ 51.6% จาก 861 เกม ห่างจากครึ่งอยู่ 1.6 จุด
        สอดคล้องกับที่ว่าฝั่งเลือกก่อนไม่ได้เปรียบขาด

  - rule_id: DRAFT_BAN_TO_BAIT
    name: แบนเพื่อล่อ ไม่ใช่แบนเพราะกลัวอย่างเดียว
    priority: 80
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        การแบนมีสองแบบ แบนเพราะไม่อยากเจอ กับแบนเพื่อล่อให้อีกฝั่งแบนตัวที่เราอยากให้เขาแบน
        ตัวที่ "ล่อซื้อกันได้" คือตัวที่ทั้งสองฝั่งอยากได้พอ ๆ กัน
        พอเราตัดตัวหนึ่ง อีกฝั่งจะถูกบังคับให้เลือกว่าจะแบนหรือจะปล่อย
        แล้วเราค่อยเก็บตัวที่เขาปล่อย
      assignments: []
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "โดยนิสัยปกติแล้วผมชอบตัด Qi ก่อน เพราะว่า Qi สามารถล่อซื้อกับ Rouie
        ในแบนที่สองฝั่งนู้นได้ ... รอดูว่าพิก 2 ผมจะกดตัวอะไร ให้เขาแบนให้ผม"
    notes: |
      ตัวอย่างในคลิปคือ Qi กับ Rouie ซึ่งข้อมูลเราหนุนว่าทั้งคู่มี priority สูงจริง
      Rouie ถูกแบน 565 จาก 861 เกม (presence 88%) และ Qi ถูกเลือก 210 ครั้ง
      แต่ "ล่อซื้อกันได้" เป็นการอ่านเกมของคู่แข่ง ไม่ใช่ตัวเลขที่เราวัดได้

  - rule_id: DRAFT_OPEN_THE_SAFE_ROLE_FIRST
    name: เปิดตำแหน่งที่โดนสวนยากที่สุดก่อน
    priority: 78
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        เวลาต้องเปิดตัวก่อน ให้เลือกตำแหน่งที่ถูกเคาน์เตอร์ได้ยากที่สุด
        โค้ชเลือกเปิดเมจก่อนออฟ เพราะเปิดออฟแล้วจะโดนสวนด้วยตัวเซ็ต
        อย่างพวกโรมตัวเกี่ยวได้ทันที
      assignments:
        - role: mid
          goto: เปิดก่อน
          note: โดนเคาน์เตอร์ตรง ๆ ยากกว่า
        - role: ds
          goto: เก็บไว้ทีหลัง
          note: เปิดแล้วโดนตัวเซ็ตสวนง่าย
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "ผมรู้สึกว่าบายพิกอะไรได้ บายพิกเมจน่าจะได้ เพราะว่าถ้า bypass off เนี่ย
        เราอาจจะโดนพวก Toro พิกนี้ได้"

  - rule_id: DRAFT_HIDE_JUNGLE_UNTIL_LAST
    name: เปิดตำแหน่งป่าเป็นตัวสุดท้าย
    priority: 82
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        กันตำแหน่งป่าไว้เปิดท้ายสุด เพื่อไม่ให้อีกฝั่งรู้ว่าตัวเฟลกของเราจะลงเลนไหน
        ถ้าเปิดป่าเร็ว เขาจะจัดตัวมาชนได้ตรงตำแหน่ง
      assignments:
        - role: jungle
          goto: เปิดท้ายสุด
          note: ปิดข้อมูลว่าตัวเฟลกจะไปเลนไหน
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "พิก 4 ก็ต้องเปิดในตำแหน่งที่เขายังไม่อยาก เขาจะต้องเปิดป่าตำแหน่งสุดท้าย
        เพื่อไม่ให้รู้ว่า Ryoma ไปเลนไหน"
    data_check:
      verdict: agrees
      n: 1722
      detail: >-
        ข้อมูลยืนยันว่าตัวที่คลิปยกมาเฟลกได้จริง — Ryoma ลง DS 84% ป่า 15%
        Marja ลง DS 71% ป่า 23% แครี่ 6% Murad ลง DS 77% ป่า 15%
        ถ้าเปิดป่าก่อน อีกฝั่งจะตัดความคลุมเครือนี้ทิ้งได้ทันที

  - rule_id: DRAFT_BLIND_PICK_OPENED_ROLE_ONLY
    name: ปลายพิกให้เลือกตำแหน่งที่เปิดไปแล้ว
    priority: 84
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: ถึงตาเลือกแล้วยังไม่รู้จะหยิบอะไร
        fact: pick_uncertain
        op: eq
        value: true
    action:
      summary: >-
        ถ้าไม่รู้จะหยิบอะไร ให้หยิบตำแหน่งที่ "เปิดไปแล้ว" ดีกว่า
        อย่าปลายพิกตำแหน่งที่ยังไม่ได้เปิด เพราะการเปิดตำแหน่งใหม่
        คือการยื่นข้อมูลให้เขาสวนฟรี
      assignments: []
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "จำไว้เลยนะ ถ้าเกิดเมจเขาเปิดแล้ว แล้วพิกต่อไปเราไม่รู้จะหยิบอะไร
        เราหยิบตำแหน่งที่มันเปิดไปแล้วดีกว่า อย่าไปปลายพิกตำแหน่งที่ยังไม่ได้เปิด"

  - rule_id: DRAFT_BAN_THE_ROLE_YOU_WONT_OPEN
    name: ตำแหน่งไหนไม่ยอมเปิด ให้แบนทิ้งแทน
    priority: 72
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        ถ้าตั้งใจจะไม่เปิดตำแหน่งไหน ให้ใช้แบนตัดตัวเด่นของตำแหน่งนั้นของอีกฝั่งแทน
        เป็นวิธีมาตรฐานที่ใช้กันอยู่แล้วในหน้าดราฟต์
      assignments: []
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "จริง ๆ มันก็เป็นวิธีที่เวลาหน้าดราฟต์เขาใช้อยู่แล้วนะ
        เวลาไม่ยอมเปิดตำแหน่งไหน เขาก็แบนทิ้ง"

  - rule_id: DRAFT_FLEX_MAKE_BOTH_LANES_BAD
    name: เฟลกให้ดี คือทำให้เขาแพ้ไม่ว่าจะสลับไปทางไหน
    priority: 90
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        การเฟลกที่ได้ผลคือเลือกตัวที่ทำให้ฮีโร่ของอีกฝั่ง "โดนทั้งสองทาง"
        ไม่ใช่แค่ชนะทางเดียว ตัวอย่างในคลิป — ถ้าเราหยิบ Qi ฝั่งตรงข้าม
        ยังสลับเลนหนีไปให้ Omen ไปชน Qi ได้ แต่ถ้าเปลี่ยนเป็น Mina
        Omen จะไปเลนไหนก็ลำบากทั้งคู่ เพราะอีกเลนมี Marja รออยู่
        หลักคิดคือมองว่าเขาจะสลับหนีไปทางไหน แล้วปิดทางนั้นตั้งแต่ตอนพิก
      assignments: []
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "ถ้าของผมเป็น Qi คือ Omen เขายังชนะฝั่งนึงไง เขายังไปชน Qi ได้
        แต่ถ้าเป็น Mina เนี่ย Omen มันไปเลนไหนมันก็ลำบาก
        ... มันต้องมีเลนใดเลนนึงโดนกดระเบิดอยู่แล้ว"
    notes: |
      ข้อนี้ต้องรู้ว่าตัวไหนเฟลกได้จริง ดูได้จากแท็บ "ตัวแก้ / แพ้ทาง"
      ที่บอกสัดส่วนเลนของแต่ละตัวจากข้อมูล 861 เกม
      ตัวที่ลงเลนเดียว 100% เช่น Tachi หรือ Capheny เอามาเฟลกไม่ได้

  - rule_id: DRAFT_CAN_YOUR_COMP_TAKE_DRAGON
    name: ดราฟต์เสร็จต้องตอบให้ได้ว่าเล่นมังกรไหวไหม
    priority: 76
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        ก่อนจบดราฟต์ให้ประเมินว่าคอมของเราลงไปแย่งมังกรได้จริงหรือไม่
        ต้องมีตัวเซ็ต ตัวดาเมจตาม และป่าที่เติมดาเมจได้
        ถ้าฝั่งเรารีดดาเมจช้ากว่า ให้วางแผนเทรด objective แทนการเข้าแย่งตรง ๆ
        และให้ซัพพอร์ตไปเซ็ตพุ่มไว้ก่อน
      assignments:
        - role: support
          goto: พุ่มรอบหลุม
          note: เซ็ตพุ่มก่อนเวลาเกิด
        - role: jungle
          goto: หลุม
          note: ต้องเป็นตัวที่เติมดาเมจให้ทันจังหวะ
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "เราดูด้วยว่าดราฟต์เราเล่นมังกรได้มั้ย ... ฝั่งแดงมีโอกาสเล่นมังกรได้ง่ายกว่า
        เพราะเขามีตัวเซ็ต มีตัวดาเมจตาม แล้วก็มีป่ามาเติมดาเมจให้
        ฝั่งเรารีดดาเมจไม่ไวเท่า เราก็อาจจะเทรด objective แทน"

  - rule_id: DRAFT_MARJA_NEEDS_EARLY_RESOURCES
    name: หยิบ Marja มาแล้วต้องป้อนทรัพยากรให้มัน
    priority: 65
    patch: "1.63"
    confidence: MEDIUM
    heroes: [marja]
    action:
      summary: >-
        Marja ไม่ใช่ตัวที่เล่นติ่ม ๆ แล้วชนะเอง มันต้องได้ทรัพยากรเยอะช่วงต้นเกม
        แล้วกลางเกมถึงจะกลายเป็นบอสของแมพที่ไม่มีใครเอาลงได้
        ถ้าดราฟต์มาแล้วไม่มีแผนป้อนของให้ ก็ไม่ควรหยิบ
      assignments:
        - role: ds
          goto: DS_LANE
          note: ให้ทรัพยากรช่วงต้น อย่าให้เลนลำบาก
    source:
      type: coach_input
      ref: คลิป "หลักการดราฟ" (ดราฟ 101)
      detail: >-
        "คีย์เวิร์ดในการเล่น Marja มันคือการที่ให้ Marja ได้ทรัพยากรเยอะ ๆ ช่วงต้นเกม
        แล้วกลางเกมมันจะกลายเป็นบอสแมพ ... มันไม่ใช่ตัวที่เล่นติ่มแล้วมันจะชนะ"
    data_check:
      verdict: agrees
      n: 286
      detail: >-
        Marja ลงเลน DS 71% ป่า 23% แครี่ 6% (n=286) เป็นตัวเฟลกจริงตามที่คลิปใช้เป็นตัวอย่าง
        และคู่กับ Rouie ได้ synergy +3.32 (n=34) ซึ่งเป็นคู่ที่ดีที่สุดคู่หนึ่งของ Rouie
