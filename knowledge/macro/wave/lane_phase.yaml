# เลนเฟสกับการจัดการเวฟ — ถอดจากคลิปวิเคราะห์แมตช์ BAC vs Buriram
# ต้นทาง knowledge/raw/bac_vs_bru
#
# เป็นคลิปบรรยายสด มีแชทปนเยอะ ใช้วิธีขุดเฉพาะช่วงที่มีเนื้อหาเชิงกลยุทธ์
# ชื่อฮีโร่ตีความแล้วเทียบกับ configs/draft/heroes.yaml ตัวไหนไม่ชัดตัดทิ้ง

rules:
  - rule_id: LANE_PHASE_ENDS_AT_4MIN
    name: เลนเฟสของ RoV มีแค่ 4 นาทีแรก
    phase: EARLY
    priority: 94
    patch: "1.63"
    confidence: HIGH
    conditions:
      - cue: นาฬิกาใกล้ 4:00
        fact: game_clock
        op: gte
        value: 210
    action:
      summary: >-
        RoV ไม่ได้มีเลนเฟสยาวเหมือน MOBA อื่น มันจบที่ 4 นาที
        ถ้าเจอคอมโบที่กดหน้าเลนหนัก อาจเหลือแค่ 2 นาทีแรกด้วยซ้ำ
        แปลว่าโอกาสได้เปรียบจากการยืนเลนมีอยู่แค่ช่วงสั้น ๆ นี้เท่านั้น
        พ้น 4 นาทีไปแล้วยังไม่ได้อะไร ให้เลิกหวังหน้าเลนแล้วไปเล่นรอบ objective แทน
      assignments:
        - role: ds
          goto: DS_LANE
          note: กดให้ได้ภายใน 4 นาที พ้นจากนั้นเลนไม่ให้แต้มต่อแล้ว
        - role: dragon
          goto: DRAGON_LANE
          note: เหมือนกัน ต้นเกมคือหน้าต่างเดียวที่มี
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram (knowledge/raw/bac_vs_bru)
      detail: >-
        "ทุกคนจำไว้เลยนะ 4 นาทีคือเลนเฟสจบแล้ว ตาม timing ปกติ
        RoV เลนเฟสมันมีแค่ 4 นาทีแรกนะ จริง ๆ อาจจะมีแค่ 2 นาทีแรก
        ถ้าคุณเจอคอมโบ... ตอนนี้คือมันอยู่ในจุดที่หน้าเลนคุณไม่มีทางได้เปรียบอีกแล้ว"
    data_check:
      verdict: agrees
      n: 861
      detail: >-
        ตรงกับที่ตัวเกมแบ่งช่วงเวลาเอง — หน้าข้อมูลสมรภูมิระบุจุดตัดที่ 4:00
        และบอกว่าที่นาทีนั้น ป้องกันป่าหายไป โล่ป้องกันป้อมหาย และส่งรถถัง
        สามอย่างนี้คือสิ่งที่ทำให้หน้าเลนหมดความหมาย ไม่ใช่ความเห็นของโค้ชคนเดียว

  - rule_id: WAVE_CONVERGENCE_CONCEDE_TOWERS
    name: เวฟชนสามทางพร้อมกัน ต้องยอมเสียป้อมบางตัว
    phase: LATE
    priority: 82
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: เสีย Dark Slayer ไปแล้วและเวฟใหญ่กำลังเข้าทั้งสามเลน
        fact: enemy_has_slayer_buff
        op: eq
        value: true
    action:
      summary: >-
        พอเสีย Dark Slayer ครีปที่ถูกเสริมจะเข้าพร้อมกันทั้งสามทาง
        จะรับให้ครบทุกป้อมเป็นไปไม่ได้ วิธีแก้คือส่งคนไปเคลียร์เฉพาะตัวใหญ่
        แล้ว **ยอมปล่อยป้อมที่เหลือ** เลือกเสียเองดีกว่าโดนไล่เก็บทีละอัน
        การพยายามรับทุกป้อมคือการกระจายกำลังจนโดนจับทีละคน
      assignments:
        - role: mid
          goto: เลนที่ตัวใหญ่เข้า
          note: เคลียร์เฉพาะตัวใหญ่ ไม่ต้องเก็บครีปเล็ก
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "เวฟมันชน 3 ทาง ... ถ้าอยากแก้ ง่ายมากเลย ต้องเอาคนวิ่งไปเคลียร์ตัวใหญ่ให้หมด
        แล้วก็ปล่อยป้อมอื่นให้หมดเลย ทำไมต้องปล่อยป้อมอื่น
        เพราะคุณไม่มีทางแก้ได้ทุกป้อม คุณต้องยอมเสียบางป้อม"

  - rule_id: EARLY_DAMAGE_REDUCTION_MATTERS
    name: ตัวลดดาเมจต้นเกมมีผลมากกว่าที่คิด
    phase: EARLY
    priority: 58
    patch: "1.63"
    confidence: MEDIUM
    heroes: [chaugnar]
    action:
      summary: >-
        ต้นเกมดาเมจต่อนัดยังน้อย การลดดาเมจเป็นเปอร์เซ็นต์จึงกินสัดส่วนสูง
        ยิงแทงค์นัดละร้อยกว่า เจอลดดาเมจราว 7-10% เหลือเข้าจริงเก้าสิบต้น ๆ
        สะสมตลอดเลนเฟสสี่นาทีแล้วต่างกันมาก
        เวลาดราฟต์เจอตัวลดดาเมจฝั่งตรงข้าม อย่าคิดว่าต้นเกมยังไงก็กดได้
    source:
      type: coach_input
      ref: คลิปวิเคราะห์ BAC vs Buriram
      detail: >-
        "ลดดาเมจต้นเกมแม่งผลโคตรเยอะนะ สมมุติคุณยิงแทงค์นัดละ 100 กว่าต้นเกม
        คุณโดนช้างลดดาเมจแบบเกือบ ๆ 10% คุณโดนลดสัก 7.5% 5%
        คุณยิง 100 ดาเมจแม่งเข้า 93"
    notes: |
      ตัวเลข 7.5-10% เป็นการประมาณของผู้พูดเอง ไม่ได้อ่านจากค่าจริงในเกม
      ให้ใช้เป็นลำดับขนาด ไม่ใช่ตัวเลขตายตัว
