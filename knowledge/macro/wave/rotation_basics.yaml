# หลักการโรเททจากบทวิเคราะห์ภายนอก — อ่อนกว่าสองกลุ่มบน เพราะไม่มีตัวเลขรองรับ
#
# ⚠️ ข้อจำกัดที่ต้องรู้: แหล่งพวกนี้เป็นบทความทั่วไป ไม่ใช่การวิเคราะห์ระดับลีก
# และเราตรวจสอบกับข้อมูลของตัวเองไม่ได้ เพราะยังไม่มี vision pipeline
# ที่อ่านตำแหน่งจากคลิปแข่งได้ ให้ถือเป็น "หลักการตั้งต้น" ไม่ใช่ข้อสรุป
#
# อัปเดต: ความรู้จากคลิปสอนถูกถอดเป็นข้อความและเข้ามาแล้ว อยู่ในไฟล์
# knowledge/macro/hero/*.yaml, draft/*.yaml, jungle/*.yaml, wave/lane_phase.yaml
# ทั้งหมดเป็น source.type: coach_input ซึ่งหนักแน่นกว่า literature ในไฟล์นี้
# เพราะระบุตัวคนพูดและยกคำพูดต้นทางมาได้

rules:
  - rule_id: WAVE_PUSH_BEFORE_ROTATE
    name: ดันเวฟให้พ้นก่อนค่อยขยับ
    phase: MID
    priority: 70
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: กำลังจะออกจากเลนไปช่วยที่อื่นหรือไปตี objective
        fact: about_to_rotate
        op: eq
        value: true
    action:
      summary: >-
        ขยับออกจากเลนโดยไม่ดันเวฟก่อน = เสียทั้งเงินและแรงกดดันบนแมพพร้อมกัน
        เวฟที่ค้างอยู่จะไหลเข้าป้อมเรา ทำให้ต้องกลับมาแก้ทีหลัง
        ในทางกลับกัน เวฟที่ดันไปแล้วบังคับให้ศัตรูต้องอยู่เคลียร์ ซื้อเวลาให้เรา
    source:
      type: literature
      ref: ID2U — Rotation ROV 2026 (มิ.ย. 2026)
      url: https://id2u.co/blog/rov-gameplay-rotation-guide-2026
      detail: '"Mid roam after push wave" · "push your wave before rotating"'

  - rule_id: WAVE_OBJECTIVE_OVER_KILL
    name: ปลายเกมเอา objective ก่อนเอาคิล
    phase: BATTLE
    priority: 80
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: ชนะปะทะแล้วและยังมีเวลาก่อนศัตรูเกิด
        fact: enemy_down_count
        op: gte
        value: 2
    action:
      shape: 5-MAN
      summary: >-
        ชนะปะทะแล้วต้องแปลงเป็นของทันที ไม่ใช่ไล่เก็บคนที่เหลือ
        ลำดับคือ objective ที่พร้อม แล้วค่อยป้อม และต้องรอเวฟก่อนตีป้อมเสมอ
        ดู TOWER_NO_CREEP_PENALTY ประกอบ
    source:
      type: literature
      ref: ID2U — Rotation ROV 2026 (มิ.ย. 2026)
      url: https://id2u.co/blog/rov-gameplay-rotation-guide-2026
      detail: '"Objective > kill in late game"'

  - rule_id: VISION_PING_MISSING
    name: หายจากเลนต้องบอก
    phase: EARLY
    priority: 50
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        เช็ค minimap ทุก ๆ ราว 10 วินาที และ ping ทุกครั้งที่คู่แข่งในเลนหายไป
        ข้อผิดพลาดที่ถูกยกบ่อยที่สุดคือไม่บอกแล้วโดนแกงค์ซ้ำที่เดิม
    source:
      type: literature
      ref: ID2U — RoV hero by role 2026 (มิ.ย. 2026)
      url: https://id2u.co/blog/rov-hero-by-role-guide-2026
      detail: '"Check minimap every 10 seconds" · "ไม่ ping missing — โดน gank ซ้ำๆ"'

  - rule_id: WAVE_SLOW_PUSH
    name: สโลว์พุช — ฆ่าครีปให้มากกว่าเวฟตัวเองมี
    phase: MID
    priority: 64
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: อยากสะสมเวฟใหญ่ไว้กดดันก่อนจะขยับไปทำอย่างอื่น
        fact: want_big_wave
        op: eq
        value: true
    action:
      summary: >-
        สโลว์พุชคือฆ่าครีปฝั่งตรงข้ามให้มากกว่าจำนวนที่เวฟเราเสียไป
        เวฟเราจะค่อย ๆ สะสมใหญ่ขึ้นแล้วไหลไปทางเขาเอง
        เคล็ดคืออย่าฆ่าครีปตัวใหญ่ระหว่างสะสม ไม่งั้นเวฟจะไม่กอง
        พอเวฟกองแล้วค่อยขยับ อีกฝั่งจะต้องเลือกว่าจะเสียป้อมหรือมาเคลียร์แบบ 4 ต่อ 5
    source:
      type: literature
      ref: GamingonPhone — How to play the Map in Arena of Valor (13 พ.ย. 2019)
      url: https://gamingonphone.com/guides/how-to-play-the-map-in-arena-of-valor/
      detail: >-
        "Slow Push: kill more minions than your own wave contains" ·
        "Avoid killing siege minions during slow pushes to allow minion stacking" ·
        "Leave lanes with waves pushing enemy-ward before rotating to create 4v5"
    data_check:
      verdict: mixed
      n: 861
      detail: >-
        เทคนิคสโลว์พุชเป็นกลไกของเวฟ ไม่ขึ้นกับแพตช์ จึงยังใช้ได้
        แต่ **แหล่งเดียวกันนี้ให้เวลา objective ผิดหมด** — อ้างว่า Abyssal Dragon
        เกิด 2:00 แล้วกลายเป็น Enraged ที่ 10:00 เกิดใหม่ทุก 5 นาที
        และ Dark Slayer เกิด 8:00 ทุก 5 นาที
        ของจริงจากหน้าข้อมูลสมรภูมิในเกมคือทั้งคู่เกิด 2:00 คูลดาวน์ 3:00
        และไม่มี Enraged Dragon ในเกมปัจจุบันเลย
        บทความลงปี 2019 เก่ากว่าแพตช์ปัจจุบันหลายปี
        ให้หยิบเฉพาะกลไกที่ไม่ขึ้นกับแพตช์ ห้ามหยิบตัวเลขเวลาจากแหล่งนี้
    notes: |
      ตัวอย่างชัดของสาเหตุที่ต้องกรอง — แหล่งเดียวกันมีทั้งของที่ใช้ได้และของที่ผิด
      เกณฑ์ที่ใช้: กลไกที่ไม่ขึ้นกับแพตช์ (การจัดการเวฟ การวางตำแหน่ง) อายุยืน
      ส่วนตัวเลข (เวลาเกิด คูลดาวน์ ดาเมจ) เน่าเร็ว ต้องยืนยันจากตัวเกมเท่านั้น
