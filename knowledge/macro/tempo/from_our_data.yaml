# แผนที่คำนวณจากแมตช์จริง 861 เกม — ทุกข้อมีตัวเลขกำกับ ตรวจย้อนได้
# ตัวเลขมาจาก rov/draft/stats.py และ rov/draft/lanes.py
# รันใหม่ได้ด้วย python scripts/export_draft_data.py

rules:
  - rule_id: TEMPO_BLUE_SIDE_EDGE
    name: ฝั่งน้ำเงินได้เปรียบเล็กน้อย แต่ไม่พอเป็นแผน
    phase: OPENING
    priority: 30
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        ฝั่งน้ำเงินชนะ 51.6% จาก 861 เกม ห่างจาก 50% อยู่ 1.6 จุด
        พอจะเป็นตัวตัดสินตอนเลือกฝั่ง แต่ไม่พอจะเอาไปวางแผนการเดินเกม
        อย่าคิดว่าอยู่ฝั่งแดงแล้วต้องเล่นต่างออกไป ข้อมูลไม่ได้บอกแบบนั้น
    source:
      type: derived_from_data
      ref: RPL ไทย + GCS ไต้หวัน 861 เกม
      detail: blue side win rate 51.57% (n=861) ความยาวเกมมัธยฐาน 16.3 นาที

  - rule_id: TEMPO_COMP_CLOCK
    name: อ่านนาฬิกาของทีมตัวเองจากตัวที่ดราฟต์มา
    phase: OPENING
    priority: 75
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        ฮีโร่แต่ละตัวมี "สัญญาณช่วงเกม" ที่วัดได้จริง — เทียบความยาวเกมที่ตัวนั้นชนะ
        กับเกมที่แพ้ ตัวที่ชนะในเกมสั้นกว่าที่แพ้ คือตัวที่ต้องรีบจบ
        ถ้าดราฟต์มาแล้วทีมเอียงไปทางต้นเกม แผนคือกดดันตั้งแต่นาทีที่ 4
        ถ้าเอียงไปทางท้ายเกม แผนคือยอมเสียพื้นที่แลกกับการไม่ตาย แล้วรอ 15:00
      assignments:
        - role: support
          goto: ตามแผนของทีม
          note: ทีมสายต้นเกมต้องโรมเร็ว ทีมสายท้ายเกมต้องเน้นกันตาย
    source:
      type: derived_from_data
      ref: 861 เกม ฮีโร่ 66 ตัวที่มีข้อมูลพอ (>= 25 เกม)
      detail: >-
        คำนวณจาก (ความยาวเกมที่ชนะเฉลี่ย − ที่แพ้เฉลี่ย) / ความยาวมัธยฐาน
        ปลายสายต้นเกม Skud −0.31 (n=161) Zata −0.26 (n=145) Florentino −0.17 (n=110)
        ปลายสายท้ายเกม Murad +0.38 (n=98) Heino +0.37 (n=49) Elsu +0.32 (n=114)
    notes: |
      สัญญาณนี้หยาบและปนกับความแข็งของทีมที่หยิบตัวนั้น
      ใช้จัดลำดับความน่าจะเป็นได้ ห้ามใช้แทนค่า scaling ที่คนกรอก
      ดู DraftStats.game_length_tendency ใน rov/draft/stats.py

  - rule_id: TEMPO_ROUIE_IS_A_MID
    name: Rouie เป็นตัวมิด ไม่ใช่ซัพพอร์ต
    phase: OPENING
    priority: 65
    patch: "1.63"
    confidence: HIGH
    heroes: [rouie]
    action:
      summary: >-
        คลาสในเกมบอกว่า Rouie เป็น support แต่ข้อมูลแข่งจริงบอกว่าลงมิด 91%
        ถ้าดราฟต์ Rouie มาแล้ววางเป็นซัพพอร์ต แปลว่าเล่นผิดจากที่ทั้งลีกเล่น
        เป็นตัวที่ถูกแบนหนักที่สุดในเกม 565 จาก 861 เกม
        ได้มาแล้วต้องเล่นให้คุ้ม เพราะโอกาสได้เล่นมีน้อย
    source:
      type: derived_from_data
      ref: 861 เกม RPL + GCS
      detail: >-
        Rouie ลงเลนมิด 91% ของ 195 เกมที่ถูกเลือก
        pick 195 ban 565 presence 88.3% win rate ถ่วงแล้ว 56.0%
        สัญญาณช่วงเกม −0.045 คือกลาง ๆ ไม่ได้บังคับให้รีบจบหรือยืดเกม
    notes: |
      เป็นตัวอย่างว่า hero_class จากเกมไม่เท่ากับเลนที่เล่นจริง
      อย่าใช้ class เดาเลน ให้ดู lane_usage จากข้อมูลแข่ง
