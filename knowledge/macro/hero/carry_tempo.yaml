# มาโครแครี่ — ถอดจากคลิป "วิเคราะห์มาโครการเล่น Carry ของ Buriram"
# ต้นทาง knowledge/raw/carrybru
#
# คลิปวิเคราะห์สไตล์ของทีมหนึ่งเป็นหลัก แต่หลักคิดข้างในใช้ได้ทั่วไป
# จึงเก็บเป็นหลักการ ไม่ผูกกับชื่อทีมหรือผู้เล่น
# ชื่อฮีโร่ในคลิปถอดเสียงเพี้ยนจนตีความไม่ชัด จึงเขียนเป็นหลักการแทนการระบุตัว

rules:
  - rule_id: CARRY_HELPS_JUNGLE_FARM
    name: แครี่ช่วยป่าเก็บแคมป์ ไม่ใช่รอเวฟอย่างเดียว
    phase: EARLY
    priority: 74
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: เคลียร์เวฟเลนตัวเองเสร็จแล้ว และไม่มีแรงกดดันบนเลน
        fact: lane_wave_cleared
        op: eq
        value: true
    action:
      summary: >-
        พอเคลียร์เลนเสร็จ แครี่ส่วนใหญ่จะไปรอกลางหรือหาจังหวะสลับเลน
        แต่รูปแบบที่คลิปชี้ว่าต่างออกไปคือแครี่เดินไปช่วยป่าเก็บแคมป์แทบทุกหลุม
        ได้ทั้งเงินเพิ่มและอยู่ในตำแหน่งที่เติมดาเมจให้ทีมได้ตลอด
        ข้อแลกเปลี่ยนคือต้องมีวิสัยทัศน์ดีพอ ไม่งั้นกลายเป็นเดินไปตายในป่าเขา
      assignments:
        - role: dragon
          goto: ป่าฝั่งตัวเอง
          note: ช่วยป่าเก็บแคมป์หลังเคลียร์เวฟ
        - role: support
          goto: แม่น้ำ
          note: ต้องมีตาให้ก่อน แครี่ถึงเดินเข้าป่าได้
    source:
      type: coach_input
      ref: คลิป "วิเคราะห์มาโครการเล่น Carry ของ Buriram" (knowledge/raw/carrybru)
      detail: >-
        "ส่วนใหญ่แล้วแครี่ในลีกเรา ถ้าเขารับเลนเสร็จ เขาจะไปหาจังหวะไปรอตรงกลาง
        ... แต่เขามาช่วยป่าฟาร์มแบบเกือบทุกหลุม แทกหลุมเขียว แล้วก็มาช่วยป่าฟาร์ม
        ... มันไม่ค่อยมีแครี่ที่ไปอยู่เลนกลางบ่อย"

  - rule_id: CARRY_POWER_SPIKE_WINDOW
    name: ตัวเก่งต้นเกมห้ามตาย เพราะมันมีหน้าต่างของตัวเอง
    phase: EARLY
    priority: 86
    patch: "1.63"
    confidence: MEDIUM
    action:
      summary: >-
        แครี่ที่แรงตอนได้ของ 3 ชิ้นมี "หน้าต่าง" ของตัวเอง ไม่ใช่แค่แรงขึ้นเรื่อย ๆ
        ถ้าตายบ่อย กราฟความแรงจะขึ้นช้าลง พอถึงจุดที่ควรได้ของครบ
        เกมเลยหน้าต่างนั้นไปแล้ว สุดท้ายกราฟไปไม่ถึงจุดที่ตัวเองเก่งที่สุด
        นี่คือเหตุผลที่ตัวเก่งต้นเกม "ห้ามตาย" ไม่ใช่เพราะเสียคิลอย่างเดียว
        แต่เพราะเสียหน้าต่างที่ทั้งดราฟต์วางไว้ให้มัน
        เวลาดราฟต์ตัวแบบนี้มา ทั้งทีมต้องเล่นรอบมันในช่วงที่มันแรง
      assignments:
        - role: dragon
          goto: เก็บทรัพยากรให้ได้มากที่สุด
          note: ใช้สปีดฟาร์มของตัวเองตอนที่ยังแรงกว่า
    source:
      type: coach_input
      ref: คลิป "วิเคราะห์มาโครการเล่น Carry ของ Buriram"
      detail: >-
        "ถ้าคุณเล่นแล้วคุณตายเยอะ มันทำให้ความเก่งมันขึ้นช้าลง แล้วพอมันขึ้นช้า
        จุดที่มันควรจะเป็น Power Spike ที่มันเก่งมาก ๆ อย่างไอเทม 3 ชิ้น
        มันก็จะดรอป มันก็จะไปไม่สุด ... ตัวที่เก่งต้นเกมมาก ๆ มันไม่ควรตายเลย"
    data_check:
      verdict: agrees
      n: 861
      detail: >-
        สัญญาณช่วงเกมที่เราวัดเองหนุนแนวคิดนี้ — ฮีโร่มีสองขั้วจริง
        ปลายสายต้นเกม Skud -0.31 (n=161) Zata -0.26 (n=145) Florentino -0.17 (n=110)
        ปลายสายท้ายเกม Murad +0.38 (n=98) Heino +0.37 (n=49) Elsu +0.32 (n=114)
        คำนวณจากความยาวเกมที่ตัวนั้นชนะเทียบกับเกมที่แพ้ แปลว่าตัวสายต้นเกม
        แพ้เมื่อเกมยืด ซึ่งตรงกับที่คลิปอธิบายด้วยกราฟ power spike

  - rule_id: CARRY_DEATH_GOLD_MATH
    name: ตายสิบสองวินาทีตอนเวฟชน เสียเงินเกือบสามร้อย
    phase: EARLY
    priority: 68
    patch: "1.63"
    confidence: MEDIUM
    conditions:
      - cue: เวฟกำลังจะชนกัน และเราคิดจะเสี่ยงเข้าปะทะ
        fact: wave_colliding
        op: eq
        value: true
    action:
      summary: >-
        ลองคิดเป็นเงินก่อนตัดสินใจเสี่ยง — ตายสิบสองวินาทีตอนเวฟชนพอดี
        อีกฝั่งเก็บเวฟเต็มได้ราวสองร้อยกว่า บวกแทกป่าอีกสองหลุมหลุมละราวสี่สิบ
        รวมแล้วเกือบสามร้อยในช่วงที่เราได้แค่เงินตามเวลาเกม
        นี่ยังไม่รวมพลังแฝงปั๊มเงินที่ยิงในไฟท์ได้อีกครั้งละสิบหกบาทต่อสแตก
        ถ้าได้คิลด้วยจะบวกอีกสองร้อย รวมเกือบสามร้อยจากไฟท์เดียว
    source:
      type: coach_input
      ref: คลิป "วิเคราะห์มาโครการเล่น Carry ของ Buriram"
      detail: >-
        "สมมุติตายสัก 10-12 วินาที ... พอเขาเคลียร์เวฟเขาจะได้ประมาณ 200 กว่า ๆ
        ถ้าเขาแทกป่าเพิ่มอีก 2 หลุม หลุมละ 37-45 บาท ... ตีไป 284
        อันนี้คือใน 12 วินาที เขามีโอกาสได้ตังค์ 284 บาท
        ในขณะที่อีกฝั่งได้แค่เงินที่เกมให้ตามเวลา"
    notes: |
      ตัวเลขบาทต่อหลุมและต่อสแตกมาจากความจำของผู้พูดเอง เขาบอกเองว่าจำไม่แม่น
      ให้ใช้เป็นลำดับขนาด (หลักร้อยต่อการตายหนึ่งครั้ง) ไม่ใช่ตัวเลขตายตัว

  - rule_id: PACE_GAMES_ARE_GETTING_FASTER
    name: เกมเร็วขึ้นจริง แต่ไม่ถึงขั้นสิบนาที
    phase: OPENING
    priority: 45
    patch: "1.63"
    confidence: LOW
    action:
      summary: >-
        คลิปบอกว่าซีซั่นนี้เกมจบไวมาก เฉลี่ยราวสิบถึงสิบสามนาที
        ไม่ค่อยไหลไปถึงสิบห้า ต่างจากยุคก่อนที่เกมสิบห้านาทีบวกเป็นเรื่องปกติ
        และเหตุผลที่ให้คือแพตช์นี้ให้ผลตอบแทนกับการสโนว์บอลต้นเกมสูงขึ้น
        พลาดได้ราวสามครั้งแล้วยังรักษาความได้เปรียบไว้ได้ จากเดิมที่พลาดได้แค่สองครั้ง
    source:
      type: coach_input
      ref: คลิป "วิเคราะห์มาโครการเล่น Carry ของ Buriram"
      detail: >-
        "เกมแข่งเฉลี่ยตอนนี้ก็ประมาณ 10 นาทีกว่า ๆ 13 นาที ไม่ค่อยไหลไป 15
        ... ซีซั่นก่อน ๆ ช่วงที่ EA เป็นแชมป์ เราจะเห็นเกม 15 นาทีบวกค่อนข้างเยอะกว่า"
    data_check:
      verdict: mixed
      n: 861
      detail: >-
        ทิศทางถูกแต่ตัวเลขไม่ตรง — RPL 2026 Summer มัธยฐาน 15.2 นาที
        เร็วกว่า RPL 2025 Winter ที่ 16.4 นาที จริงตามที่บอกว่าเกมไวขึ้น
        แต่ไม่ได้อยู่ที่ 10-13 นาที และ 50.2% ของเกมยังยาวเกิน 15 นาที
        เกมที่จบต่ำกว่า 10 นาทีมีแค่ 7.2% ส่วน GCS ไต้หวันยิ่งช้ากว่า
        มัธยฐาน 17.1 นาที เกินสิบห้านาทีถึง 68.4%
    notes: |
      ความต่างอาจมาจากวิธีนับ ค่าที่เราใช้คือช่อง length ของ Liquipedia
      ซึ่งยังไม่ได้ยืนยันว่านับตั้งแต่จุดไหนของเกม
      ถ้าเป็นการนับคนละจุด ตัวเลขสองชุดนี้ก็ไม่ได้ขัดกันจริง
      ให้เชื่อ "ทิศทาง" ได้ แต่ยังอย่าเอาตัวเลขนาทีไปตั้งเป็นเกณฑ์ในระบบ
