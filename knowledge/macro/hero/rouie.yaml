# มาโคร Rouie — ถอดจากคลิปสอนที่ผู้ใช้ส่งมา
# ต้นทาง knowledge/raw/marco_ru (และหัวข้อ "มาโครและคอมโบ Rouie"
# ใน knowledge/raw/rov_transcripts_complete.md)
#
# เป็นบทถอดเสียงอัตโนมัติ มีคำผิดเยอะ ชื่อฮีโร่ถูกตีความแล้วเทียบกับ
# configs/draft/heroes.yaml และเทียบกับเลนที่ฮีโร่นั้นเล่นจริงในข้อมูล 861 เกม
# ตัวไหนตีความไม่ชัดตัดทิ้ง ไม่เดา
#
# data_check ทุกข้อคำนวณจากข้อมูลของเราเอง ไม่ใช่ความเห็น

rules:
  - rule_id: ROUIE_NEEDS_STRONG_SIDE_LANES
    name: ดราฟต์ Rouie ต้องมีออฟแข็งและแครี่แข็ง
    phase: OPENING
    priority: 92
    patch: "1.63"
    confidence: HIGH
    heroes: [rouie]
    action:
      summary: >-
        Rouie อ่อนแอช่วงต้นเกมและต้องพึ่งเพื่อนมาก ถ้าจะหยิบมาต้องมีเลนออฟ
        ที่ยืนได้เองและเลนแครี่ที่แข็ง ไม่งั้นจะไม่มีใครถือแมพให้ระหว่างที่
        Rouie ยังทำอะไรไม่ได้ในสองสามนาทีแรก
      assignments:
        - role: ds
          goto: เลนตัวเอง
          note: ต้องยืนได้เองโดยไม่ต้องให้ใครมาช่วย
        - role: dragon
          goto: เลนตัวเอง
          note: ต้องกดหน้าเลนได้ ไม่ใช่แค่ฟาร์มรอ
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie" (knowledge/raw/marco_ru)
      detail: >-
        "ถ้าเราเล่นนี่ เราจะต้องมีเลน off ที่แข็งแรง แล้วก็เลนแคร์รี่ที่แข็งแรง
        สาเหตุหลัก ๆ เพราะว่าตัวนี้มันต้องพึ่งเพื่อนเยอะ ตัวมันค่อนข้างอ่อนแอ
        ในช่วงต้นเกม"
    data_check:
      verdict: agrees
      n: 195
      detail: >-
        synergy จาก 861 เกมหนุนข้อนี้ชัด — คู่กับตัวออฟแข็ง Marja +3.32 (n=34)
        Skud +3.29 (n=24) Qi +2.50 (n=32) และคู่กับแครี่ Hayate +4.13 (n=36)
        ล้วนเป็นบวก ขณะที่คู่กับป่า Tachi -1.21 (n=21) Billow -0.76 (n=16)
        เป็นลบ ทิศทางตรงกับที่โค้ชบอกว่าต้องแข็งที่ "ข้าง" ไม่ใช่ที่ป่า

  - rule_id: ROUIE_EARLY_GAME_SHAPE
    name: สองสามนาทีแรก Rouie ยังทำอะไรไม่ได้
    phase: OPENING
    priority: 80
    patch: "1.63"
    confidence: MEDIUM
    heroes: [rouie]
    conditions:
      - cue: นาฬิกายังไม่ถึง 3:00
        fact: game_clock
        op: lte
        value: 180
    action:
      summary: >-
        ช่วงแรก Rouie ยืนค่อนไปทางกลางและเล่นเซฟ บีบแมพ คุมเวฟ
        ให้โรมกับแครี่คุมหน้าเลนของตัวเองไว้ แล้วแวะมากลางเป็นครั้งคราว
        เพื่อช่วย Rouie เคลียร์หรือรับป่าที่เข้ามาเชื่อมกลาง
        Rouie ไม่จำเป็นต้องคุมเลนข้าง แต่ถ้าจะคุมต้องอยู่ในวิสัยทัศน์ที่ดี
      assignments:
        - role: mid
          goto: MID
          note: เล่นเซฟ บีบแมพ คุมเวฟ
        - role: support
          goto: เลนแครี่ แล้วแวะกลาง
          note: มาช่วยเคลียร์หรือรับป่าที่เชื่อมกลาง
        - role: dragon
          goto: DRAGON_LANE
          note: คุมหน้าเลนไว้เอง
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie"
      detail: >-
        "ในช่วงแรก ในสเกล 2 หรือ 3 นาทีแรกเนี่ย Rouie มันทำอะไรไม่ค่อยได้เยอะ
        หลัก ๆ จะเป็นโรมกับแครี่ที่คุมหน้าเลน แล้วก็แวะมากลางบ้าง
        เพื่อช่วย Rouie เคลียร์ หรือป่าที่เข้ามาเชื่อมกลาง"

  - rule_id: ROUIE_FIRST_OBJECTIVE
    name: Rouie เคลียร์ช้า ต้องวางแผนหน้า objective แรกให้เพื่อนลงพร้อมกัน
    phase: EARLY
    priority: 78
    patch: "1.63"
    confidence: MEDIUM
    heroes: [rouie]
    conditions:
      - cue: ใกล้ objective ตัวแรกนาทีที่ 2
        fact: seconds_to_objective_spawn
        op: lte
        value: 45
    action:
      summary: >-
        Rouie เคลียร์ช้ากว่าเมจตัวอื่น ป่าจึงนิยมจบฝั่งบนเป็นหลัก
        เพื่อให้สองคนเดินลงมาพร้อมกันได้ ส่วนโรมกับแครี่เคลียร์หน้าเลนก่อน
        จุดอ่อนคือถ้า Rouie ไม่ได้คุมเลนข้างมันต้องเดินอ้อม อาจโดนดักป่า
        หรือมาไม่ทัน แล้วเพื่อนที่ลงมาจากข้างบนจะเล่นไม่ได้
        อีกทางคือให้แครี่ลากมังกรลงไปโซนเลนล่าง ให้อีกฝั่งเสียเวลาตามไป
      assignments:
        - role: jungle
          goto: จบฝั่งบนก่อน
          note: เพื่อให้เดินลงมาพร้อมกันสองคน
        - role: dragon
          goto: DRAGON_LANE
          note: ลากมังกรลงโซนล่างได้ ถ้าจะกินเวลาอีกฝั่ง
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie"
      detail: >-
        "Rouie มันเป็นตัวที่เคลียร์ช้า ป่านิยมจะเอาจบฝั่งบนเป็นหลัก
        เพื่อที่จะเดินสองคนลงมาพร้อมกัน ... เวลามันไม่ได้คุมเลนข้าง
        มันต้องเดินอ้อม นี่คือข้อเสียของมัน"

  - rule_id: ROUIE_ROTATE_TO_SIDE_LANE
    name: โยก Rouie ไปเลนข้าง — สามวิธี และจุดอ่อนที่กลาง
    phase: MID
    priority: 88
    patch: "1.63"
    confidence: MEDIUM
    heroes: [rouie]
    conditions:
      - cue: กลางเกม เวฟเลนข้างถูกดันไปแล้ว และ Rouie พร้อมวาร์ป
        fact: side_wave_pushed
        op: eq
        value: true
    action:
      summary: >-
        หัวใจของการเล่น Rouie คือการโยกไปเลนข้างเพื่อกดดันด้วยวาร์ป
        มีสามวิธี (1) ป่ารับกลางคนเดียว Rouie ไปเลนออฟ โรมกับแครี่เคลียร์เลนข้างก่อน
        (2) เอาโรมเข้ามารับกลางคู่กับป่า แล้ว Rouie ไปเลนข้าง — กลางมีสองคนจึงแข็ง
        (3) เอา Rouie ลงไปเล่นเลนแครี่แทนโรม แล้วส่งโรมขึ้นไปกลาง
        เงื่อนไขที่ต้องมีก่อนโยกคือดันเวฟให้พ้นก่อน และตำแหน่งที่เหลือต้องเคลียร์ครีปได้ดี
        โยกผิดจังหวะจะเล่นยากทันที
      assignments:
        - role: mid
          goto: เลนข้าง
          note: เล่นวาร์ปเอาหน้าป้อม
        - role: jungle
          goto: MID
          note: ถ้ารับคนเดียวต้องเคลียร์ครีปเองได้และไม่ถูกไดฟ์ง่าย
        - role: support
          goto: MID
          note: วิธีที่ 2 — เข้ามารับกลางคู่กับป่า ให้กลางแข็งพอ
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie"
      detail: >-
        "วิธีแรก ป่ารับกลางคนเดียว Rouie ไปเล่นเลน off แล้วก็โรมกับแครี่
        เคลียร์เลนข้างก่อน วิธีที่สอง เอาโรม ป่ารับกลาง Rouie ไปเล่นเลนข้างแทน
        ... จุดอ่อนมันคืออยู่ตรงกลาง เวลา Rouie โยกเลนข้าง ถ้าฝั่งตรงข้าม
        ยอมแลกหรือรู้ว่ารับได้ เขาจะบี้กลางอัดทันที"
    notes: |
      จุดอ่อนที่โค้ชย้ำ: พอ Rouie ออกจากกลาง อีกฝั่งจะบี้กลางทันที
      ถ้าป่าไม่เก่งหรือฮีโร่ไม่เอื้อจะโดนไดฟ์ และการโยก Rouie กลับมากลางทำได้ยาก
      บางทีเขายอมเสียป้อมบนฟรีเพื่อแลกกับการเข้ากลาง

  - rule_id: ROUIE_ECONOMY_LOOP
    name: โยก Rouie ไปเลนข้างคือการบูทการเงิน ไม่ใช่แค่ดันป้อม
    phase: LATE
    priority: 70
    patch: "1.63"
    confidence: MEDIUM
    heroes: [rouie]
    conditions:
      - cue: เกมตามหรือต้องการเร่งการเงิน และอีกฝั่งกรุ๊ปกัน 4-5 คน
        fact: team_gold_behind
        op: eq
        value: true
    action:
      summary: >-
        เวลาอีกฝั่งกรุ๊ปกัน 4-5 คน ให้โยก Rouie ขึ้นไปเลนข้าง
        เพราะมันทั้งบูทการเงินและกลับบ้านได้ง่ายด้วยวาร์ป
        ดันเลนหนึ่ง วาร์ปกลับมาเคลียร์กลาง เคลียร์ข้าง วนแบบนี้ได้เรื่อย ๆ
        แต่ต้องกลับมาให้ทันสองเวฟที่เข้าจากข้างบนกับตรงกลาง
        เพดานคือดันได้แค่โซนป้อมชั้นสอง ดันถึงหน้าบ้านไม่ได้
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie"
      detail: >-
        "มันคือการบูทการเงินด้วย ไม่ใช่ไปดันอย่างเดียว ... แต่ต้องกลับมาให้ทัน
        2 เวฟที่เข้าจากข้างบนกับตรงกลาง ... มันดันจนถึงหน้าบ้านไม่ได้
        ทำได้สูงสุดแค่โซนป้อม 2"

  - rule_id: ROUIE_COUNTER_LIST_FROM_CLIP
    name: ตัวที่คลิปบอกว่าแก้ Rouie — ข้อมูลเราค้านเกือบทั้งชุด
    phase: OPENING
    priority: 60
    patch: "1.63"
    confidence: LOW
    heroes: [rouie]
    action:
      summary: >-
        คลิประบุตัวแก้ Rouie ไว้หลายตัว กลุ่มเมต้าคือ Ming+Capheny, Lorion
        (โดยเฉพาะคู่กับ Tachi), Tachi+Dolia, Biron, Maloch, Enzo, Riktor,
        Skud, Qi, Hayate, Florentino และกลุ่ม underrate คือ Yan, Aoi,
        Kriknak, Zata, Aya, Wiro, Natalya
        เหตุผลเชิงกลไกที่ให้ไว้คือ Rouie กลัวตัวเบิร์สต์ที่กระโดดใส่แล้วจบ
        กับตัวที่ผลักออกวง เพราะมันเก่งตอนที่ยังมีเพื่อนอยู่รอบตัว
      assignments: []
    source:
      type: coach_input
      ref: คลิปสอน "มาโครและคอมโบ Rouie" หัวข้อ Meta Counter และ Under Rate
      detail: >-
        "ตัวที่โคตรจะชนะทางคอม Rouie มาก ๆ ก็คือ Biron หรือ Maloch
        เวลาจะเล่นทีเนี่ยต้องแบน Maloch หนักมาก ... Lorion คู่ Tachi
        โคตรจะเคาน์เตอร์ Rouie เลย"
    data_check:
      verdict: disagrees
      n: 195
      detail: >-
        ตัวที่คลิปบอกส่วนใหญ่กลับ "แพ้" Rouie ไม่ใช่ชนะ —
        Lorion เจอ Rouie ได้ 46.1% (n=89) และเฉพาะที่ประกบกันในเลนมิด 46.3%
        (n=82) ซึ่งเป็นตัวอย่างใหญ่สุดและค้านชัดที่สุด
        TeeMee 35.9% (n=39) Skud 36.4% (n=22) Qi 41.4% (n=29)
        Florentino 25.0% (n=12) Natalya 18.2% (n=11) ล้วนแพ้
        มีเพียง Maloch 61.5% (n=13) ที่ตรงกับคลิป ส่วน Riktor Zata Aoi Wiro
        เป็นบวกแต่ n=3-7 ซึ่งน้อยเกินจะสรุป
    notes: |
      ทั้งสองฝั่งอาจถูกทั้งคู่ และไม่ได้แปลว่าโค้ชผิด

      คลิปพูดถึง "กลไก" ว่าฮีโร่ตัวนั้นมีเครื่องมือจัดการ Rouie
      ข้อมูลเราวัด "ผลแพ้ชนะของทั้งเกม" ซึ่งปนทุกอย่าง

      ที่สำคัญกว่านั้น Rouie ถูกแบน 565 จาก 861 เกม เกมที่มันหลุดมาให้เล่น
      จึงเป็นเกมที่ทีมนั้นอยากได้มันจริง ๆ และมักเป็นทีมที่ดราฟต์รอบมันมาแล้ว
      ตัวเลข "X เจอ Rouie" จึงเอียงเพราะเงื่อนไขการถูกเลือก ไม่ใช่เพราะกลไก

      สรุปที่ปลอดภัย: ใช้รายชื่อนี้เป็น "ตัวเลือกที่ควรลอง" ไม่ใช่ข้อสรุป
      และอย่าเอาไปตั้งเป็นน้ำหนักในระบบแนะนำจนกว่าจะมีข้อมูลระดับเลนมากกว่านี้
