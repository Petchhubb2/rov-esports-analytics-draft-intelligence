[project]
name = "rov-analytics"
version = "0.1.0"
description = "RoV Esports Analytics & Draft Intelligence"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "av>=13",
    "pyarrow>=17",
    "polars>=1.0",
    "pydantic>=2.8",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rov = "rov.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
